name = "maison-samaa-crm"
pages_build_output_dir = "dist"

compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
vars = { JWT_SECRET = "ms-jwt-secret-change-in-prod", META_APP_SECRET = "your-meta-app-secret" }
[[env.production.d1_databases]]
binding = "DB"
database_name = "maison-samaa-db"
database_id = "your-d1-database-id"

[env.preview]
vars = { JWT_SECRET = "ms-jwt-secret-dev", META_APP_SECRET = "dev-secret" }
[[env.preview.d1_databases]]
binding = "DB"
database_name = "maison-samaa-db"
database_id = "your-d1-database-id"
